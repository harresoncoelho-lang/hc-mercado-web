<!DOCTYPE html>
<html lang="pt-br" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — LicitaPlena</title>
<link rel="icon" type="image/png" href="favicon.png?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ds-tokens.css">
<link rel="stylesheet" href="senha-olho.css">
<script>
  // Tema antes de pintar (sem piscar): mesma chave e mesmo padrão claro do sistema (app-comercial.js).
  (function () { var t = null; try { t = localStorage.getItem("licitaplena_tema"); if (t === null) { var v = localStorage.getItem("licitaplena.tema"); if (v !== null) { t = v === "dark" ? "escuro" : "claro"; localStorage.setItem("licitaplena_tema", t); localStorage.removeItem("licitaplena.tema"); } } } catch (e) { t = null; } document.documentElement.dataset.theme = t === "escuro" ? "dark" : "light"; })();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
<script src="supabase-config.js"></script>
<script src="senha-captcha-ui.js"></script>
<script src="https://js.hcaptcha.com/1/api.js" async defer></script>
<style>
  /* Design System "Direção A, azul original": cores, raios e tipografia vêm de ds-tokens.css. */
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 24px;
    display: flex; align-items: center; justify-content: center;
    font: var(--text-body); color: var(--text-primary); background: var(--surface-page);
  }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .caixa {
    width: 100%; max-width: 400px; padding: 24px;
    background: var(--surface-default); border: 1px solid var(--border-default); border-radius: var(--radius-card);
  }
  .topo { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 24px; }
  .marca { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 16px; line-height: 24px; color: var(--text-primary); text-decoration: none; }
  /* Placa clara fixa: o azul-marinho do símbolo continua legível no tema escuro (regra do DS). */
  .placa { display: inline-grid; place-content: center; width: 32px; height: 32px; border-radius: var(--radius-control); background: #f6f8fc; border: 1px solid #e3e8f0; flex: none; }
  .placa img { width: 24px; height: 24px; display: block; }
  h1 { font: var(--text-section); margin: 0 0 4px; }
  p.sub { color: var(--text-secondary); margin: 0 0 24px; }
  label { display: block; font: var(--text-label); margin-bottom: 4px; }
  input {
    width: 100%; height: 40px; padding: 0 12px; margin-bottom: 16px;
    background: var(--surface-default); color: var(--text-primary);
    border: 1px solid var(--border-strong); border-radius: var(--radius-control);
  }
  .campo-senha-wrap { margin-bottom: 16px; }
  .campo-senha-wrap input { margin-bottom: 0; }
  .btn {
    height: 40px; padding: 0 16px; border-radius: var(--radius-control); border: 1px solid transparent;
    font-weight: 500; font-size: 14px; cursor: pointer; white-space: nowrap;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-sec { background: var(--surface-default); color: var(--text-primary); border-color: var(--border-strong); }
  .btn-sec:hover { background: var(--surface-sunken); }
  .btn-ter { background: transparent; color: var(--action-text); height: 32px; padding: 0 8px; font-size: 12px; }
  .btn-ter:hover { background: var(--action-tint); }
  button.entrar { width: 100%; background: var(--action-strong); color: var(--action-on); }
  button.entrar:hover { background: var(--action-strong-hover); }
  button.entrar:disabled { background: var(--surface-sunken); color: var(--text-disabled); border-color: var(--border-default); cursor: not-allowed; }
  .captcha-rotulo { font: var(--text-label); color: var(--text-secondary); margin: 0 0 8px; }
  .h-captcha { margin-bottom: 16px; min-height: 78px; max-width: 100%; overflow-x: auto; }
  /* Aviso: cor + texto + sinal (estado nunca só por cor). */
  .aviso { margin-top: 16px; padding: 12px 16px; border-radius: var(--radius-card); border: 1px solid; display: none; gap: 8px; }
  .aviso::before { font-weight: 700; flex: none; }
  .aviso.erro { background: var(--error-bg); border-color: var(--error-border); color: var(--error-text); }
  .aviso.erro::before { content: "!"; }
  .aviso.ok { background: var(--success-bg); border-color: var(--success-border); color: var(--success-text); }
  .aviso.ok::before { content: "✓"; }
  .rodape-link { text-align: center; margin-top: 24px; color: var(--text-secondary); }
  a { color: var(--action-text); }
  .rodape-legal { text-align: center; margin-top: 16px; font: var(--text-label); color: var(--text-secondary); }
  .rodape-legal a { color: var(--text-secondary); margin: 0 6px; }
  .rodape-legal a:hover { color: var(--action-text); }

  /* Celular (375–480px): cartão encosta no topo e perde a borda lateral larga. */
  @media (max-width: 480px) {
    body { padding: 12px; align-items: flex-start; }
    .caixa { padding: 20px 16px; margin-top: 12px; }
  }
</style>
</head>
<body>
  <main class="caixa">
    <div class="topo">
      <a href="index.html" class="marca"><span class="placa"><img src="logo-icone.svg" alt=""></span>LicitaPlena</a>
      <button type="button" class="btn btn-ter" id="tema">Tema escuro</button>
    </div>
    <h1>Entrar</h1>
    <p class="sub">Entre com o e-mail e a senha do seu cadastro.</p>

    <form id="form-login">
      <label for="email">E-mail</label>
      <input type="email" id="email" required autocomplete="email">
      <label for="senha">Senha</label>
      <div class="campo-senha-wrap">
        <input type="password" id="senha" required autocomplete="current-password">
        <button type="button" class="btn-mostrar-senha" data-alvo="senha" aria-controls="senha" aria-pressed="false" aria-label="Mostrar senha" title="Mostrar senha">
          <svg class="olho-aberto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="olho-fechado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.9 10.9 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.1 9.1 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
        </button>
      </div>

      <p class="captcha-rotulo">Verificação de segurança</p>
      <div class="h-captcha" data-sitekey="E358601C-A03C-4316-9F24-B3DC4316992E"></div>
      <script>document.querySelector(".h-captcha").dataset.theme = document.documentElement.dataset.theme; SenhaCaptchaUi.aplicarChaveHCaptcha(document, location.hostname);</script>

      <button type="submit" class="btn entrar" id="btn-entrar">Entrar</button>
    </form>

    <div class="aviso" id="aviso" role="status" aria-live="polite"></div>

    <div class="rodape-link">
      Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a>
    </div>
    <div class="rodape-legal">
      <a href="termos-de-uso.html">Termos de uso</a>·<a href="politica-privacidade.html">Privacidade</a>·<a href="politica-cookies.html">Cookies</a>
    </div>
  </main>

<script>
  // Alternar tema: grava na mesma chave que o sistema lê.
  (function () {
    const b = document.getElementById("tema");
    const pintar = () => { b.textContent = document.documentElement.dataset.theme === "dark" ? "Tema claro" : "Tema escuro"; };
    pintar();
    b.addEventListener("click", () => {
      const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = t;
      try { localStorage.setItem("licitaplena_tema", t === "dark" ? "escuro" : "claro"); } catch (e) { /* preferência opcional */ }
      pintar();
    });
  })();
</script>
<script>
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ?voltar= só aceita caminho deste site ("/sistema"); "//outro.site", "/\outro" ou URL completa caem no painel,
  // para o login nunca virar redirecionador aberto.
  function destinoSeguro(voltar) {
    if (typeof voltar !== "string" || !/^\/(?![\/\\])/.test(voltar)) return "painel.html";
    try {
      const u = new URL(voltar, window.location.origin);
      return u.origin === window.location.origin ? u.pathname + u.search + u.hash : "painel.html";
    } catch (e) { return "painel.html"; }
  }
  const parametros = new URLSearchParams(window.location.search);
  const destino = destinoSeguro(parametros.get("voltar"));

  SenhaCaptchaUi.ligarOlhosDaSenha(document); // ícone de olho da senha

  function mostrarAviso(texto, tipo) {
    const el = document.getElementById("aviso");
    el.textContent = texto;
    el.className = "aviso " + tipo;
    el.style.display = "flex";
  }

  // Motivo vindo do sistema (/sistema): só códigos conhecidos, com texto daqui; nada da URL vai para a tela.
  const AVISOS_SISTEMA = {
    analise: ["Seu cadastro ainda está em análise. Você recebe um aviso assim que for aprovado.", "erro"],
    expirada: ["Sua sessão expirou. Entre novamente.", "erro"],
    saiu: ["Sessão encerrada.", "ok"],
  };
  const codigoAviso = parametros.get("aviso");
  const avisoSistema = codigoAviso && Object.prototype.hasOwnProperty.call(AVISOS_SISTEMA, codigoAviso) ? AVISOS_SISTEMA[codigoAviso] : null;
  if (avisoSistema) mostrarAviso(avisoSistema[0], avisoSistema[1]);

  document.getElementById("form-login").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const btn = document.getElementById("btn-entrar");
    btn.disabled = true;
    btn.textContent = "Entrando...";

    const email = document.getElementById("email").value.trim();
    const senha = document.getElementById("senha").value;

    // Token do hCaptcha, enviado se o widget estiver presente/resolvido — a exigência de
    // captcha está temporariamente desativada no Supabase (Attack Protection), então não
    // bloqueia mais o login localmente se vier vazio.
    const captchaToken = typeof hcaptcha !== "undefined" ? hcaptcha.getResponse() : "";

    const { data, error } = await sb.auth.signInWithPassword({ email, password: senha, options: { captchaToken } });

    if (error) {
      mostrarAviso(
        error.message && error.message.toLowerCase().includes("captcha")
          ? "Não foi possível confirmar que você não é um robô. Marca a caixinha do captcha e tenta de novo."
          : "E-mail ou senha incorretos, ou sua conta ainda não foi aprovada.",
        "erro"
      );
      if (typeof hcaptcha !== "undefined") hcaptcha.reset();
      btn.disabled = false;
      btn.textContent = "Entrar";
      return;
    }

    // Confere o status do cadastro antes de liberar o acesso.
    const { data: cliente } = await sb
      .from("clientes")
      .select("status, nome")
      .eq("id", data.user.id)
      .single();

    if (!cliente || cliente.status !== "aprovado") {
      mostrarAviso("Seu cadastro ainda está em análise. Você recebe um aviso assim que for aprovado.", "erro");
      await sb.auth.signOut();
      if (typeof hcaptcha !== "undefined") hcaptcha.reset();
      btn.disabled = false;
      btn.textContent = "Entrar";
      return;
    }

    mostrarAviso("Login realizado! Redirecionando...", "ok");
    window.location.href = destino;
  });
</script>
</body>
</html>
