<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — LicitaPlena</title>
<link rel="icon" type="image/png" href="favicon.png?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="https://js.hcaptcha.com/1/api.js" async defer></script>
<style>
  :root {
    --azul: #2e8dff; --azul-escuro: #0d47a1; --laranja: #f2891a;
    --fundo: #0a121c; --cartao: #141f2e; --borda: #223144;
    --texto: #eef3f8; --texto-fraco: #90a2b8; --verde: #34c17c; --vermelho: #e8617a;
    --raio: 12px;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Inter", Arial, Helvetica, sans-serif;
    background: radial-gradient(1100px 500px at 15% -10%, rgba(46,141,255,0.14), transparent 60%), var(--fundo);
    background-attachment: fixed;
    color: var(--texto);
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .caixa {
    width: 100%;
    max-width: 400px;
    background: var(--cartao);
    border: 1px solid var(--borda);
    border-radius: var(--raio);
    padding: 32px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.45);
  }
  .logo-topo { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  .logo-topo img { width: 40px; height: 40px; }
  .logo-topo span { font-weight: 700; font-size: 18px; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p.sub { color: var(--texto-fraco); font-size: 14px; margin: 0 0 24px; }
  label { display: block; font-size: 13px; color: var(--texto-fraco); margin-bottom: 6px; }
  input {
    width: 100%; padding: 11px 12px; margin-bottom: 16px;
    background: #0d1826; border: 1px solid var(--borda); border-radius: 8px;
    color: var(--texto); font-size: 14px; font-family: inherit;
  }
  input:focus { outline: none; border-color: var(--azul); }
  .campo-senha-wrap { position: relative; }
  .campo-senha-wrap input { padding-right: 42px; }
  .btn-mostrar-senha {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    margin-top: -8px; background: none; border: none; cursor: pointer;
    color: var(--texto-fraco); padding: 4px; line-height: 1;
  }
  .btn-mostrar-senha:hover { color: var(--texto); }
  .btn-mostrar-senha svg { display: block; width: 18px; height: 18px; }
  button.entrar {
    width: 100%; padding: 12px; background: var(--laranja); color: #1a1005;
    border: none; border-radius: 8px; font-weight: 700; font-size: 15px; cursor: pointer;
  }
  button.entrar:hover { filter: brightness(1.08); }
  button.entrar:disabled { opacity: 0.6; cursor: default; }
  .aviso { margin-top: 16px; padding: 10px 12px; border-radius: 8px; font-size: 13px; display: none; }
  .aviso.erro { background: rgba(232,97,122,0.12); border: 1px solid var(--vermelho); color: #ffb3c1; }
  .aviso.ok { background: rgba(52,193,124,0.12); border: 1px solid var(--verde); color: #a6f0c6; }
  .rodape-link { text-align: center; margin-top: 20px; font-size: 13px; color: var(--texto-fraco); }
  .rodape-link a { color: var(--azul); text-decoration: none; }
  .rodape-link a:hover { text-decoration: underline; }
  .rodape-legal { text-align: center; margin-top: 18px; font-size: 12px; color: var(--texto-fraco); }
  .rodape-legal a { color: var(--texto-fraco); text-decoration: underline; margin: 0 6px; }
  .rodape-legal a:hover { color: var(--azul); }

  /* Tablet (768px), celular grande (414px) e pequeno (375px) */
  @media (max-width: 480px) {
    body { padding: 10px; align-items: flex-start; }
    .caixa { padding: 22px 18px; margin-top: 24px; }
  }
</style>
</head>
<body>
  <div class="caixa">
    <div class="logo-topo">
      <img src="logo-icone-branco.svg" alt="LicitaPlena">
      <span>LicitaPlena</span>
    </div>
    <h1>Acessar conta</h1>
    <p class="sub">Entre com o e-mail e senha do seu cadastro.</p>

    <form id="form-login">
      <label for="email">E-mail</label>
      <input type="email" id="email" required autocomplete="email">
      <label for="senha">Senha</label>
      <div class="campo-senha-wrap">
        <input type="password" id="senha" required autocomplete="current-password">
        <button type="button" class="btn-mostrar-senha" data-alvo="senha" title="Mostrar/ocultar senha" aria-label="Mostrar ou ocultar senha">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <div class="h-captcha" data-sitekey="E358601C-A03C-4316-9F24-B3DC4316992E" style="margin-bottom:16px;"></div>

      <button type="submit" class="entrar" id="btn-entrar">Entrar</button>
    </form>

    <div class="aviso" id="aviso"></div>

    <div class="rodape-link">
      Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a>
    </div>
    <div class="rodape-legal">
      <a href="termos-de-uso.html">Termos de uso</a>·<a href="politica-privacidade.html">Privacidade</a>·<a href="politica-cookies.html">Cookies</a>
    </div>
  </div>

<script>
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Ícone de olho: alterna type="password" <-> type="text" no campo alvo.
  document.querySelectorAll(".btn-mostrar-senha").forEach((btn) => {
    btn.addEventListener("click", () => {
      const alvo = document.getElementById(btn.dataset.alvo);
      alvo.type = alvo.type === "password" ? "text" : "password";
    });
  });

  function mostrarAviso(texto, tipo) {
    const el = document.getElementById("aviso");
    el.textContent = texto;
    el.className = "aviso " + tipo;
    el.style.display = "block";
  }

  document.getElementById("form-login").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const btn = document.getElementById("btn-entrar");
    btn.disabled = true;
    btn.textContent = "Entrando...";

    const email = document.getElementById("email").value.trim();
    const senha = document.getElementById("senha").value;

    // Token do hCaptcha, enviado se o widget estiver presente/resolvido — a exigência de
    // captcha está temporariamente desativada no Supabase (Attack Protection), então não
    // bloqueia mais o login localmente se vier vazio.
    const captchaToken = typeof hcaptcha !== "undefined" ? hcaptcha.getResponse() : "";

    const { data, error } = await sb.auth.signInWithPassword({ email, password: senha, options: { captchaToken } });

    if (error) {
      mostrarAviso(
        error.message && error.message.toLowerCase().includes("captcha")
          ? "Não foi possível confirmar que você não é um robô. Marca a caixinha do captcha e tenta de novo."
          : "E-mail ou senha incorretos, ou sua conta ainda não foi aprovada.",
        "erro"
      );
      if (typeof hcaptcha !== "undefined") hcaptcha.reset();
      btn.disabled = false;
      btn.textContent = "Entrar";
      return;
    }

    // Confere o status do cadastro antes de liberar o acesso.
    const { data: cliente } = await sb
      .from("clientes")
      .select("status, nome")
      .eq("id", data.user.id)
      .single();

    if (!cliente || cliente.status !== "aprovado") {
      mostrarAviso("Seu cadastro ainda está em análise. Você recebe um aviso assim que for aprovado.", "erro");
      await sb.auth.signOut();
      if (typeof hcaptcha !== "undefined") hcaptcha.reset();
      btn.disabled = false;
      btn.textContent = "Entrar";
      return;
    }

    mostrarAviso("Login realizado! Redirecionando...", "ok");
    window.location.href = "painel.html";
  });
</script>
</body>
</html>
