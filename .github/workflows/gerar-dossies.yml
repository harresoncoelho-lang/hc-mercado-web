name: Gerar dossiês dos editais (Gemini)

# Substitui o preparar-dossies.yml, que chamava o GPT-5.1 pelo AI Gateway da Netlify
# (~40 créditos por edital). Aqui o robô chama o Gemini direto na cota gratuita e só
# processa editais pedidos no painel (fila_dossies) ou enviados nos boletins. Não
# escreve no repositório: grava em dossies_editais no Supabase.
concurrency:
  group: gerar-dossies
  cancel-in-progress: false

on:
  schedule:
    # A cada 10 min: o clique do cliente entra na fila e fica pronto na rodada seguinte.
    # Repositório público, então as execuções não custam nada. O GitHub pode atrasar o
    # agendamento em horários de pico; o painel mostra a ficha do PNCP enquanto isso.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: Diagnóstico temporário do PNCP
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          for path in "04477782000105/compras/2026/12" "07602404000102/compras/2026/11" "00394429000100/compras/2026/2311"; do
            for base in "https://pncp.gov.br/api/pncp/v1/orgaos" "https://pncp.gov.br/pncp-api/v1/orgaos"; do
              echo "== $base/$path/arquivos"
              curl -sS -o /tmp/r.json -w "http=%{http_code} t=%{time_total}s bytes=%{size_download} ip=%{remote_ip}\n" -A "$UA" -H "Accept: application/json" --max-time 40 "$base/$path/arquivos" || true
              head -c 400 /tmp/r.json 2>/dev/null; echo
            done
          done
          echo "== consulta api"
          curl -sS -o /dev/null -w "http=%{http_code} t=%{time_total}s\n" -A "$UA" --max-time 40 "https://pncp.gov.br/api/consulta/v1/orgaos/04477782000105/compras/2026/12" || true
      - name: Gerar dossiês da fila e dos boletins
        if: false
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LIMITE_MINUTOS_DOSSIES: "8"
          # Prazos de download do PNCP do robô (a Function no site usa 4 s / 3,5 s).
          TIMEOUT_LISTA_PNCP_MS: "20000"
          TIMEOUT_ARQUIVO_PNCP_MS: "60000"
        run: node scripts/gerar_dossies_gemini.js
