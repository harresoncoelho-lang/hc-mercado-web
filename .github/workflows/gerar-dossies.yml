name: Gerar dossiês dos editais (Gemini)

# Substitui o preparar-dossies.yml, que chamava o GPT-5.1 pelo AI Gateway da Netlify
# (~40 créditos por edital). Aqui o robô chama o Gemini direto na cota gratuita e só
# processa editais pedidos no painel (fila_dossies) ou enviados nos boletins. Não
# escreve no repositório: grava em dossies_editais no Supabase.
concurrency:
  group: gerar-dossies
  cancel-in-progress: false

on:
  schedule:
    # Reserva a cada 10 min, fora dos minutos redondos; o GitHub ainda pode atrasar cron.
    - cron: "9,19,29,39,49,59 * * * *"
  # Preparar logo após a chegada dos dados, sem depender do cron nem do primeiro clique.
  workflow_run:
    workflows: ["Atualizar dados do PNCP", "Recuperar UFs pendentes do PNCP"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gerar:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: Preparar leitor isolado de anexos
        run: docker build -t licitaplena-anexos:local -f scripts/Dockerfile.anexos .
      - name: Validar conversores sem IA nem rede
        run: >-
          docker run --rm --network=none --read-only --cap-drop=ALL
          --security-opt=no-new-privileges --memory=1g --cpus=1 --pids-limit=128
          --tmpfs=/tmp:rw,size=268435456,mode=1777 --env=HOME=/tmp --env=TESTAR_CONVERSORES=1
          --mount type=bind,source=${{ github.workspace }},target=/repo,readonly
          --entrypoint python3 licitaplena-anexos:local /repo/scripts/test_extrair_anexo.py
      - name: Validar agrupamento de volumes sem IA
        env:
          IMAGEM_EXTRATOR_ANEXOS: licitaplena-anexos:local
        run: node --test scripts/extrair_anexo_local.test.js netlify/functions/__tests__/edital-operacional.test.js
      - name: Gerar dossiês da fila e dos boletins
        env:
          # Cadeia de provedores de IA com troca automática (ver cabeçalho do script).
          # Chave ausente = provedor desligado.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Último recurso da cadeia: 10.000 neurons/dia grátis (~300 mil tokens de entrada do
          # gpt-oss-120b, só alguns editais), para quando Gemini e OpenRouter esgotam a cota.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_AI_MODELOS: ${{ vars.CLOUDFLARE_AI_MODELOS }}
          MISTRAL_MODELOS: ${{ vars.MISTRAL_MODELOS }}
          OPENROUTER_MODELOS: ${{ vars.OPENROUTER_MODELOS }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LIMITE_MINUTOS_DOSSIES: "8"
          LEITURA_MULTIFORMATO: "1"
          IMAGEM_EXTRATOR_ANEXOS: licitaplena-anexos:local
          # Prazos de download do PNCP do robô (a Function no site usa 4 s / 3,5 s).
          TIMEOUT_LISTA_PNCP_MS: "20000"
          TIMEOUT_ARQUIVO_PNCP_MS: "60000"
        run: node scripts/gerar_dossies_gemini.js
