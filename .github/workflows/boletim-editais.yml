name: Boletim diario de editais

on:
  schedule:
    # Roda 3x ao dia, no horario de Brasilia (UTC-4, sem horario de verao):
    - cron: "0 11 * * *"  # 07:00 Brasilia
    - cron: "0 16 * * *"  # 12:00 Brasilia
    - cron: "0 21 * * *"  # 17:00 Brasilia
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  boletim:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar boletim de editais
        env:
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_SENHA_APP: ${{ secrets.EMAIL_SENHA_APP }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/boletim_editais.py
        # O historico de editais ja vistos agora vai direto pro Supabase (tabela
        # dados_robo) em vez de data/editais_vistos.json commitado no git - assim
        # essa execucao nao dispara mais uma publicacao completa do site no Netlify
        # (isso rodava 3x/dia, era a maior fatia dos disparos automaticos).
