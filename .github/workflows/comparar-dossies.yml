name: Comparar dossiês Gemini x GPT (temporário)

# Temporário, só no branch do PR: mede a qualidade do Gemini em editais que já têm
# dossiê do GPT-5.1. Não grava no Supabase. Remover antes do merge.
on:
  push:
    branches: [claude/pausar-dossies-ia]
    paths: [.github/workflows/comparar-dossies.yml, scripts/comparar_dossies_gemini.js]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  comparar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: Comparar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EDITAIS: "63606479000124-1-000564/2026,04384829000196-1-000558/2026,04384829000196-1-000550/2026,12226205000179-1-000035/2026,06553929000124-1-000043/2026,12248878000120-1-000020/2026,04059671000189-1-000011/2026,04056198000186-1-000030/2026,13120225000123-1-000153/2026,13120225000123-1-000154/2026"
        run: node scripts/comparar_dossies_gemini.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comparacao
          path: comparacao/
