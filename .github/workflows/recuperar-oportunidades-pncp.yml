name: Recuperar UFs pendentes do PNCP

# Executa uma recuperação leve entre as coletas completas. Nunca disputa escrita
# com o robô principal: se ele estiver ativo, esta execução aguarda a vez.
concurrency:
  group: atualizar-dados-pncp
  cancel-in-progress: false

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  recuperar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Recuperar somente UFs pendentes
        env:
          SOMENTE_OPORTUNIDADES: "1"
          RECUPERAR_UFS_PENDENTES: "1"
          LIMITE_MINUTOS_OPORTUNIDADES: "28"
          CONCORRENCIA_UF_OPORTUNIDADES: "2"
          INTERVALO_MS_OPORTUNIDADES: "900"
          MIN_UFS_OK_OPORTUNIDADES: "1"
        run: node scripts/atualizar_dados.js
      - name: Preparar dossiês recém-coletados
        env:
          LICITAPLENA_URL: "https://licitaplena.com.br"
          # A recuperação é a rota de entrada dos editais durante o dia. Preparar
          # aqui elimina a espera de uma coleta diária para o primeiro clique.
          MAX_DOSSIES_POR_EXECUCAO: "120"
          DIAS_PUBLICACAO_DOSSIE: "7"
          CONCORRENCIA_DOSSIES: "3"
          REPROCESSAR_PARCIAL_APOS_HORAS: "24"
          DOSSIES_EDITAIS_CHAVE: ${{ secrets.DOSSIES_EDITAIS_CHAVE }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$DOSSIES_EDITAIS_CHAVE" ]; then
            echo "DOSSIES_EDITAIS_CHAVE não configurada; preparação antecipada aguardará a configuração do segredo."
            exit 0
          fi
          node scripts/preparar_dossies_editais.js
      - name: Publicar recuperação válida
        run: |
          git config user.name "hc-licitacoes-bot"
          git config user.email "actions@github.com"
          git add data/oportunidades_abertas.json data/boletim/
          if git diff --cached --quiet; then
            echo "Nenhuma UF recuperada nesta tentativa."
            exit 0
          fi
          git commit -m "Recuperação automática de UFs pendentes do PNCP - $(date -u +'%Y-%m-%d %H:%M UTC')"
          # A recuperação roda de hora em hora e pode coincidir com um deploy ou uma
          # edição manual no main. Não transformar uma coleta válida em falha só por
          # um push não-fast-forward: reintegra o remoto e tenta novamente, como o
          # robô principal já faz.
          for tentativa in 1 2 3; do
            if git push; then
              break
            fi
            echo "Push rejeitado (tentativa $tentativa) — atualizando com o remoto e tentando de novo."
            git fetch origin main
            git rebase origin/main || { git rebase --abort; git merge -X ours origin/main -m "Merge automático da recuperação"; }
            if [ "$tentativa" = "3" ]; then
              echo "Não foi possível publicar a recuperação após 3 tentativas."
              exit 1
            fi
          done
