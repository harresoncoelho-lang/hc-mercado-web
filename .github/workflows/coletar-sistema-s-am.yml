name: Coletar Sistema S AM

on:
  schedule:
    # 10:00 UTC = 07:00 no horario de Brasilia (depois do PNCP e do Portal da Transparencia)
    - cron: "0 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rodar robo de coleta do Sistema S/AM
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/coletar_sistema_s_am.js
        # Os dados agora vao direto pro Supabase (tabela dados_robo) em vez de
        # data/sistema_s_am.json commitado no git - assim essa execucao nao dispara
        # mais uma publicacao completa do site no Netlify a cada rodada.
