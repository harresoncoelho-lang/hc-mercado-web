name: Atualizar dados do PNCP

on:
  schedule:
    # 09:00 UTC = 06:00 no horário de Brasília (sem horário de verão)
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rodar robô de coleta
        env:
          DIAS_HISTORICO_INICIAL: "30"
          RETENCAO_DIAS: "730"
          LIMITE_MINUTOS_CONTRATOS: "13"
          LIMITE_MINUTOS_MERCADO: "13"
          CONCORRENCIA_PAGINAS: "5"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/atualizar_dados.js

      - name: Consolidar base de empresas (Fase 1)
        run: node scripts/coletar_empresas.js

      - name: Coletar cadastro de fornecedores SICAF (Fase 4)
        env:
          LIMITE_MINUTOS: "12"
          ATRASO_MS: "250"
        run: node scripts/coletar_fornecedores_sicaf.js

      - name: Enriquecer cadastro das empresas (Fase 2)
        env:
          LIMITE_MINUTOS: "10"
          RENOVAR_APOS_DIAS: "180"
          ATRASO_MS: "350"
        run: node scripts/enriquecer_empresas.js

      - name: Complementar e-mail/telefone (Fase 2b)
        env:
          LIMITE_MINUTOS: "15"
          RENOVAR_APOS_DIAS: "90"
          ATRASO_MS: "13000"
        run: node scripts/enriquecer_contato.js

      - name: Enriquecer cadastro SICAF puro (Fase 4b)
        env:
          LIMITE_MINUTOS: "25"
          RENOVAR_APOS_DIAS: "365"
          ATRASO_MS: "350"
        run: node scripts/enriquecer_sicaf.js

      - name: Complementar e-mail/telefone do SICAF puro (Fase 4c)
        env:
          LIMITE_MINUTOS: "8"
          RENOVAR_APOS_DIAS: "90"
          ATRASO_MS: "13000"
        run: node scripts/enriquecer_contato_sicaf.js

      - name: Publicar dados privados no painel interno (Base de Empresas/SICAF)
        env:
          PAINEL_INTERNO_TOKEN: ${{ secrets.PAINEL_INTERNO_TOKEN }}
        run: |
          set -e
          if [ -z "$PAINEL_INTERNO_TOKEN" ]; then
            echo "PAINEL_INTERNO_TOKEN não configurado, pulando publicação no painel interno."
            exit 0
          fi
          rm -rf /tmp/painel-interno
          git clone --depth 1 "https://harresoncoelho-lang:${PAINEL_INTERNO_TOKEN}@github.com/harresoncoelho-lang/hc-painel-interno.git" /tmp/painel-interno
          mkdir -p /tmp/painel-interno/data/fornecedores
          cp data/empresas.json /tmp/painel-interno/data/empresas.json
          cp data/fornecedores/*.json /tmp/painel-interno/data/fornecedores/
          cd /tmp/painel-interno
          git config user.name "hc-licitacoes-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nenhuma mudança nos dados privados hoje."
          else
            git commit -m "Atualização automática da base de fornecedores - $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push "https://harresoncoelho-lang:${PAINEL_INTERNO_TOKEN}@github.com/harresoncoelho-lang/hc-painel-interno.git" HEAD:main
          fi

      - name: Commitar e enviar dados atualizados
        run: |
          git config user.name "hc-licitacoes-bot"
          git config user.email "actions@github.com"
          git add data/
          # empresas.json e fornecedores/ são propositalmente PRIVADOS (base de prospecção só
          # da HC, publicada acima no painel interno) — nunca vão pro site público dos clientes.
          git reset -- data/empresas.json data/fornecedores/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nenhuma mudança nos dados hoje."
          else
            git commit -m "Atualização automática de dados do PNCP - $(date -u +'%Y-%m-%d %H:%M UTC')"
            # Se o main tiver avançado desde o checkout (ex: edição manual em paralelo),
            # tenta reintegrar antes de enviar em vez de simplesmente falhar o push.
            for tentativa in 1 2 3; do
              if git push; then
                break
              fi
              echo "Push rejeitado (tentativa $tentativa) — atualizando com o remoto e tentando de novo."
              git fetch origin main
              git rebase origin/main || { git rebase --abort; git merge -X ours origin/main -m "Merge automático do robô"; }
              if [ "$tentativa" = "3" ]; then
                echo "Não foi possível enviar os dados após 3 tentativas."
                exit 1
              fi
            done
          fi
