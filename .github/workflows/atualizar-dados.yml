name: Atualizar dados do PNCP

on:
  schedule:
    # 09:00 UTC = 06:00 no horário de Brasília (sem horário de verão)
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rodar robô de coleta
        env:
          DIAS_HISTORICO_INICIAL: "30"
          RETENCAO_DIAS: "730"
          LIMITE_MINUTOS: "25"
        run: node scripts/atualizar_dados.js

      - name: Commitar e enviar dados atualizados
        run: |
          git config user.name "hc-licitacoes-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nenhuma mudança nos dados hoje."
          else
            git commit -m "Atualização automática de dados do PNCP - $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
