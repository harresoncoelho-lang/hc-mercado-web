name: Coletar Convenios (Portal da Transparencia)

on:
  schedule:
    # 09:45 UTC = 06:45 no horario de Brasilia (depois do robo do PNCP e de licitacoes)
    - cron: "45 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rodar robo de coleta de convenios
        env:
          TRANSPARENCIA_TOKEN: ${{ secrets.TRANSPARENCIA_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LIMITE_MINUTOS: "13"
          RETENCAO_DIAS: "730"
        run: node scripts/coletar_convenios.js
        # Os dados agora vao direto pro Supabase (tabela dados_robo) em vez de
        # data/convenios.json commitado no git - assim essa execucao nao dispara mais
        # uma publicacao completa do site no Netlify a cada rodada.
