<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PE 406/2026 — Resumo do Edital</title><style>
*{box-sizing:border-box}body{margin:0;background:#e6e9ed;color:#222;font:14px Arial,sans-serif}.fundo{position:fixed;inset:0;background:#0003}.drawer{position:relative;margin-left:auto;width:85%;max-width:1080px;height:100vh;background:white;display:flex;flex-direction:column;box-shadow:-6px 0 24px #0002}header{padding:20px 28px 14px;border-bottom:1px solid #ddd;background:white;flex-shrink:0;display:flex;justify-content:space-between;align-items:center}header h1{margin:0 0 5px;font-size:22px;font-weight:600}header p{margin:0;color:#737373;font-size:13px}.marca{font-size:17px;font-weight:700;color:#173b60}main{overflow-y:auto;padding:22px 28px 34px;flex:1}.objeto{margin:0 0 20px;line-height:1.5;font-size:15px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}.card{padding:16px;background:#fff;border:1px solid #e5e5e5;border-radius:5px}.card small{display:block;color:#777;font-size:12px;margin-bottom:8px}.card strong{font-size:16px;font-weight:600}details{margin:0 0 10px;border:1px solid #e3e3e3;border-radius:4px;overflow:hidden}summary{list-style:none;display:flex;align-items:center;gap:10px;cursor:pointer;padding:13px 16px;background:#f3f3f3;font-weight:600;font-size:14px}summary::-webkit-details-marker{display:none}summary:after{content:'⌄';margin-left:auto;font-size:19px;color:#777;line-height:1}details[open]>summary:after{transform:rotate(180deg)}.icone{width:20px;color:#75818c;font-weight:400}.campos{padding:8px 18px 13px;display:grid;grid-template-columns:1fr 1fr;column-gap:34px}.campo{padding:11px 0;min-width:0}.campo.longo{grid-column:1/-1}dt{font-size:12px;color:#777;margin-bottom:6px}dd{margin:0;line-height:1.55;color:#252525;white-space:pre-line}ul{margin:0;padding-left:18px}li{padding-left:2px;margin:0 0 7px}li:last-child{margin-bottom:0}.nota{font-size:11px;color:#777;line-height:1.5;margin-top:18px}textarea{width:100%;min-height:95px;border:1px solid #d5d5d5;border-radius:4px;padding:12px;font:14px Arial;resize:vertical;margin:14px 0 2px}footer{flex-shrink:0;background:#fff;border-top:1px solid #ddd;padding:14px 28px;display:flex;gap:10px;justify-content:flex-end}button,a.botao{border:1px solid #ddd;border-radius:4px;background:white;color:#454545;padding:11px 14px;font:13px Arial;cursor:pointer;text-decoration:none}button.principal{background:#173b60;color:white;border-color:#173b60}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #91b8de;outline-offset:2px}#status{font-size:12px;color:#49664a;margin:7px 0 0;min-height:14px}@media(max-width:700px){.drawer{width:100%}header,main{padding-left:16px;padding-right:16px}.marca{display:none}.cards{gap:6px}.card{padding:12px 9px}.card strong{font-size:13px}.campos{grid-template-columns:1fr}.campo{grid-column:1/-1}footer{padding:10px;gap:6px;flex-wrap:wrap}button,a.botao{padding:10px;font-size:12px}}@media print{.fundo,footer{display:none}.drawer{width:100%;max-width:none;height:auto;box-shadow:none}main{overflow:visible;padding:15px 0}header{padding:0 0 15px}.cards{margin-bottom:15px}details{border:0;overflow:visible;break-inside:auto}summary{break-after:avoid}summary:after{display:none}.campo{break-inside:avoid}.nota{font-size:9px}textarea{display:none}details:last-of-type .campos:after{content:attr(data-nota);white-space:pre-line}body{background:#fff;font-size:11px}dt{font-size:10px}summary{font-size:12px}.card{padding:10px}@page{size:A4;margin:14mm}}
</style></head><body><div class="fundo"></div><div class="drawer"><header><div><h1>Resumo do Edital PE 406/2026</h1><p id="numero"></p></div><span class="marca">LicitaPlena</span></header><main><button disabled style="margin-bottom:16px">Pergunte ao Edital</button><p class="objeto" id="objeto"></p><div class="cards" id="cards"></div><div id="secoes"></div><p class="nota" id="fonte"></p><p class="nota">Prévia visual: ações de envio, geração e impressão desativadas neste exemplo.</p></main><footer><a class="botao" id="edital" target="_blank" rel="noopener" style="margin-right:auto">Baixar Edital Completo</a><button disabled>Enviar Checklist por E-mail</button><button disabled>Gerar Checklist .docx</button><button disabled>Imprimir Checklist</button></footer></div><script>
const escapeHtml = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let notas;
fetch('/resumo.json').then(r=>{if(!r.ok)throw Error('Resumo indisponível');return r.json()}).then(data=>{
 document.getElementById('numero').textContent=data.numero;
 document.getElementById('objeto').textContent=data.objeto;
 document.getElementById('fonte').textContent=data.fonte;
 document.getElementById('edital').href=data.link;
 document.getElementById('cards').innerHTML=data.cards.map(([k,v])=>`<div class="card"><small>${escapeHtml(k)}</small><strong>${escapeHtml(v)}</strong></div>`).join('');
 const icones=['▤','◷','▥','▧','◇','▣','◷','▤','☷','▤','✓','§','▱','ⓘ','$','!','◇','✎'];
 document.getElementById('secoes').innerHTML=data.secoes.map((s,i)=>`<details open><summary><span class="icone" aria-hidden="true">${icones[i]}</span>${escapeHtml(s.titulo)}</summary><dl class="campos">${s.campos.map(c=>`<div class="campo ${Array.isArray(c.valor)||c.valor.length>210||c.rotulo==='Objeto'?'longo':''}"><dt>${escapeHtml(c.rotulo)}</dt><dd>${Array.isArray(c.valor)?`<ul>${c.valor.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul>`:escapeHtml(c.valor)}</dd></div>`).join('')}${i===17?'<div class="campo longo"><label for="notas">Suas considerações sobre esta licitação</label><textarea id="notas" placeholder="Escreva aqui suas considerações..."></textarea><p id="status" role="status"></p></div>':''}</dl></details>`).join('');
 notas=document.getElementById('notas');
 try{notas.value=localStorage.getItem('previa-p406-consideracoes')||''}catch{}

}).catch(e=>{document.getElementById('objeto').textContent=e.message});
</script></body></html>
