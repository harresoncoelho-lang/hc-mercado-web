<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // Aplica o tema salvo (localStorage) antes de qualquer coisa renderizar — sem isso, a
  // página pintaria com o tema padrão (escuro) por uma fração de segundo e só depois
  // trocaria pro tema claro salvo, causando um "flash" visível. Roda o mais cedo possível
  // no <head>, antes do <style> e antes do <body> existir (ver botão de alternância no
  // header e o handler de clique, mais abaixo, perto dos outros botões do header).
  (function () {
    try {
      if (localStorage.getItem("licitaplena_tema") === "claro") {
        document.documentElement.classList.add("tema-claro");
      }
    } catch (e) { /* localStorage indisponível: segue com o tema padrão (escuro) */ }
  })();
</script>
<title>LicitaPlena — Inteligência, gestão e automação em licitações</title>
<link rel="icon" type="image/png" href="favicon.png?v=3">

<script>
  // Guarda de acesso: só entra quem tiver login aprovado. Roda antes do resto da página carregar.
  (function () {
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    sb.auth.getSession().then(async ({ data: { session } }) => {
      if (!session) {
        window.location.replace("login.html");
        return;
      }
      const { data: cliente } = await sb.from("clientes").select("nome, empresa, cnpj, telefone, status, segmento, atividades, estados_interesse, como_conheceu, quantidade_funcionarios, licitacoes_por_mes, faturamento_anual, como_pretende_usar, plano").eq("id", session.user.id).maybeSingle();
            if (!cliente || cliente.status !== "aprovado") {
                      await sb.auth.signOut();
                      window.location.replace("login.html");
                      return;
            }
            window.__clienteAtual = cliente;
            window.__clienteEmailAtual = session.user.email || "";
            if (typeof window.__preencherIdentidadeUsuario === "function") window.__preencherIdentidadeUsuario();
    });
        window.__sbClient = sb;
  })();
</script>
<style>
  :root {
    --azul: #2e8dff;
    --azul-escuro: #0d47a1;
    --laranja: #f2891a;
    --laranja-forte: #ff9d33;
    --fundo: #0a121c;
    --cartao: #141f2e;
    --cartao-claro: #182638;
    --borda: #223144;
    --texto: #eef3f8;
    --texto-fraco: #90a2b8;
    --verde: #34c17c;
    --vermelho: #e8617a;
    --raio: 12px;
    --raio-pq: 8px;
    --sombra: 0 4px 18px rgba(0,0,0,0.35);
    --sombra-forte: 0 10px 30px rgba(0,0,0,0.45);
    /* ---- Variáveis novas (tema claro/escuro) — valores abaixo são os do tema
       escuro (padrão), redefinidos em html.tema-claro mais abaixo. ---- */
    --fundo-fraco: #0f1a26;
    --fundo-elevado: #152232;
    --fundo-elevado-hover: #1b2c3f;
    --fundo-hover: #10202f;
    --input-borda: #2a3c50;
    --aviso-fundo: #3a2b0f;
    --aviso-texto: #ffd9a0;
    --chip-fundo: #0f2a4a;
    --chip-texto: #cfe0fb;
    --chip-texto-medio: #6fa8f5;
    --chip-borda: #24476f;
    --vermelho-fundo-hover: #241419;
    --scrollbar-hover: #2f4763;
    --overlay-hover: rgba(255,255,255,0.05);
    --overlay-fraco: rgba(255,255,255,0.06);
    --zebra-tint: rgba(255,255,255,0.015);
    --azul-texto: #2e8dff;
    --laranja-texto: #f2891a;
    --laranja-forte-texto: #ff9d33;
    --verde-texto: #34c17c;
    --vermelho-texto: #e8617a;
    --aviso-neutro-borda: #2a3c50;
    --aviso-neutro-texto: #9fb0c3;
    /* Valor de reserva até o JS medir a altura real do header (ver IIFE logo após o
       header no <body>) e sobrescrever com o valor exato — serve só pra evitar um "pulo"
       visual grande antes do JS rodar; hoje o header fica em torno de 56px (compacto). */
    --altura-header: 56px;
  }
  /* ---- Tema claro: mesma ideia do escuro, valores diferentes. Aplicado trocando
     a classe "tema-claro" no <html> (ver botão de alternância no header e o script
     de aplicação logo no <head>, antes do <body>, pra não piscar o tema errado). */
  html.tema-claro {
    --azul: #2e8dff;
    --azul-escuro: #0d47a1;
    --laranja: #f2891a;
    --laranja-forte: #ff9d33;
    --fundo: #f4f6f9;
    --cartao: #ffffff;
    --cartao-claro: #f8fafc;
    --borda: #dde3ea;
    --texto: #152232;
    --texto-fraco: #5b6b7f;
    --verde: #34c17c;
    --vermelho: #e8617a;
    /* Variantes escurecidas dos acentos, só pra quando são usados como COR DE TEXTO
       direto sobre --cartao/--fundo (não como fundo sólido de botão/badge) — o azul/
       laranja/verde/vermelho "puros" acima não têm contraste AA suficiente como texto
       sobre fundo claro; como fundo sólido com texto branco/escuro fixo em cima, esses
       já funcionam bem sem mudar (contraste verificado, ver relatório final). */
    --azul-texto: #1c63c7;
    --laranja-texto: #a85500;
    --laranja-forte-texto: #8f4700;
    --verde-texto: #0f7a4d;
    --vermelho-texto: #c0293f;
    --aviso-neutro-borda: #dde3ea;
    --aviso-neutro-texto: #5b6b7f;
    --sombra: 0 4px 14px rgba(15,35,60,0.08);
    --sombra-forte: 0 10px 26px rgba(15,35,60,0.12);
    --fundo-fraco: #eef2f7;
    --fundo-elevado: #f1f5f9;
    --fundo-elevado-hover: #e2e8f0;
    --fundo-hover: #e8eef5;
    --input-borda: #cbd5e1;
    --aviso-fundo: #fff4e0;
    --aviso-texto: #8a5a00;
    --chip-fundo: #e3edfc;
    --chip-texto: #0d47a1;
    --chip-texto-medio: #1c63c7;
    --chip-borda: #b6d4fb;
    --vermelho-fundo-hover: #fdecec;
    --scrollbar-hover: #94a3b8;
    --overlay-hover: rgba(0,0,0,0.045);
    --overlay-fraco: rgba(0,0,0,0.05);
    --zebra-tint: rgba(0,0,0,0.025);
  }
  * { box-sizing: border-box; }
  /* Ícones Phosphor (peso "fill", ver sprite logo após <body>): monocromático por padrão,
     cor herdada de "color" (currentColor) — muda de cor sozinho em qualquer contexto que já
     define color pra destaque/ativo, sem precisar de CSS extra por ícone. */
  .icone-ph { width: 1em; height: 1em; fill: currentColor; flex-shrink: 0; vertical-align: -0.125em; display: inline-block; }
  body {
    font-family: "Inter", Arial, Helvetica, sans-serif;
    background:
      radial-gradient(1100px 500px at 15% -10%, rgba(46,141,255,0.14), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(242,137,26,0.10), transparent 55%),
      var(--fundo);
    background-attachment: fixed;
    color: var(--texto);
    margin: 0;
    -webkit-font-smoothing: antialiased;
  }
  /* Header compacto (~56px de altura total), no estilo faixa fina do ConLicitação, em vez
     do banner grande de antes (~112px no desktop). A altura vem do padding vertical (8px
     em cima + 8px embaixo = 16px) somado à altura do maior filho da linha, que são os
     botões de ícone (.header-icone-btn) a 40px — 16 + 40 = 56px. Como o alvo já é compacto
     em qualquer largura de tela, não precisa mais de breakpoint nenhum reduzindo altura;
     só o padding horizontal aperta um pouco em telas pequenas (só estética, não afeta
     altura nem corta nada — os 40px de botão não encolhem em nenhum tamanho de tela).
     A altura real (medida via JS logo após o </header>, ver --altura-header) é o que a nav
     lateral, o painel de filtros do Diagnóstico de Mercado e o .shell usam pra saber onde
     começar — funciona automaticamente com qualquer altura de header, sem precisar mexer
     nesses outros lugares quando o header muda de tamanho. */
  header {
    background: linear-gradient(120deg, var(--azul-escuro) 0%, var(--azul) 55%, #1c63c7 100%);
    padding: 8px 24px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.35);
    position: sticky;
    top: 0;
    /* Abaixo dos modais/overlays (z-index 200) e dos dropdowns do próprio header
       (z-index 500, ver #header-user-dropdown/#header-bell-dropdown — esses são
       position:fixed e recalculam a posição a cada abertura via
       getBoundingClientRect(), então continuam funcionando normalmente com o
       header fixo). Acima de tudo o resto da página (conteúdo, nav, filtros). */
    z-index: 50;
    overflow: hidden;
  }
  header::after {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(600px 200px at 90% -40%, rgba(255,255,255,0.18), transparent 60%);
    pointer-events: none;
  }
  .header-topo { display: flex; align-items: center; justify-content: space-between; gap: 16px; position: relative; }
  .header-marca {
    display: flex; align-items: center; gap: 10px; min-width: 0;
    text-decoration: none; color: inherit; flex-shrink: 0;
  }
  .header-logo {
    width: 36px; height: 36px; flex-shrink: 0;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.35));
  }
  .header-nome {
    font-size: 17px; font-weight: 700; letter-spacing: -0.2px; color: #fff;
    white-space: nowrap;
  }
  .header-acoes { display: flex; gap: 8px; position: relative; flex-shrink: 0; align-items: center; }
  /* Badges discretos de empresa/plano — fundo claro, texto escuro, formato pílula.
     Somem primeiro em telas pequenas (ver breakpoint abaixo); logo, nome, ajuda, sino e
     avatar continuam sempre visíveis. */
  .header-badge {
    display: inline-flex; align-items: center; gap: 4px;
    background: rgba(255,255,255,0.92); color: #1a2b45;
    font-size: 11px; font-weight: 700; white-space: nowrap;
    padding: 5px 10px; border-radius: 999px;
  }
  .header-badge-plano { background: rgba(255,157,51,0.95); }
  /* 40px de área de toque — não encolhe em nenhuma largura de tela, mesmo com o
     header compacto. */
  .header-icone-btn { width: 40px; height: 40px; flex-shrink: 0; }
  @media (max-width: 768px) {
    .header-badge { display: none; }
  }
  @media (max-width: 560px) {
    header { padding: 8px 14px; }
    .header-topo { gap: 10px; }
    .header-nome { font-size: 15px; }
  }

  .shell {
    display: flex;
    align-items: stretch;
    width: 100%;
    min-height: calc(100vh - var(--altura-header));
  }

  nav {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 6px;
    padding: 24px 12px;
    background: var(--fundo);
    border-right: 1px solid var(--borda);
    width: 128px;
    flex-shrink: 0;
    position: sticky;
    /* Gruda logo abaixo do header (que agora também é sticky), não no topo absoluto —
       senão a nav ficaria por baixo do header ao rolar, escondida atrás dele. */
    top: var(--altura-header);
    align-self: flex-start;
    height: calc(100vh - var(--altura-header));
    overflow-y: auto;
  }
  nav button {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    text-align: center;
    background: transparent;
    border: none;
    color: var(--texto-fraco);
    padding: 14px 6px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    border-radius: 12px;
    white-space: normal;
    line-height: 1.25;
    transition: background 0.15s, color 0.15s;
  }
  nav button:hover { background: var(--overlay-hover); color: var(--texto); }
  nav button .nav-ico {
    width: 44px; height: 44px; border-radius: 11px;
    background: var(--overlay-fraco);
    display: flex; align-items: center; justify-content: center; font-size: 21px;
    transition: background 0.15s;
  }
  nav button.ativo {
    color: var(--texto);
    background: rgba(46,141,255,0.14);
  }
  nav button.ativo .nav-ico {
    background: linear-gradient(135deg, var(--azul), var(--azul-escuro));
    box-shadow: 0 2px 8px rgba(46,141,255,0.45);
  }

  #nav-colapsar-btn {
    padding: 10px 6px;
    margin-bottom: 6px;
    border-bottom: 1px solid var(--borda);
    border-radius: 0;
  }
  #nav-colapsar-btn .nav-ico { width: 44px; height: 28px; font-size: 16px; background: transparent; }

  /* Sidebar recolhida: só ícones, sem rótulo (o rótulo continua no DOM, só escondido —
     o hover mostra o texto completo de novo via o atributo title=, um tooltip nativo do
     navegador, sem precisar de nenhum componente novo). Só em desktop/tablet largo — no
     mobile a <nav> já vira uma faixa horizontal (ver @media 768px mais abaixo), onde
     colapsar não faz sentido; por isso essas regras ficam dentro do min-width:769px. */
  @media (min-width: 769px) {
    nav.colapsada { width: 68px; }
    nav.colapsada button .nav-label { display: none; }
    nav.colapsada button { padding: 10px 4px; }
    nav.colapsada #nav-colapsar-btn .nav-ico { transform: scaleX(-1); }
  }

  main { flex: 1; min-width: 0; padding: 28px 40px 70px; }
  section { display: none; }
  section.ativa { display: block; }

  /* Tablet (768px) e celular (480px/375px): a sidebar vira uma faixa horizontal
     que desliza com o dedo, em vez de ficar fixa ocupando espaço lateral ou
     quebrar os botões em várias linhas. O <main> ocupa 100% da largura porque
     a <nav> deixa de ser uma coluna lateral. */
  @media (max-width: 768px) {
    .shell { flex-direction: column; min-height: 0; }
    nav {
      flex-direction: row;
      flex-wrap: nowrap;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      position: static;
      height: auto;
      align-items: stretch;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      border-right: none;
      border-bottom: 1px solid var(--borda);
      padding: 10px 18px;
      gap: 4px;
    }
    nav::-webkit-scrollbar { display: none; }
    nav button {
      flex-shrink: 0;
      white-space: nowrap;
      width: auto;
      padding: 8px 14px;
      font-size: 12px;
    }
    nav button .nav-ico { width: 30px; height: 30px; font-size: 15px; }
    main { width: 100%; padding: 20px 16px 60px; }
    /* Colapsar não faz sentido nessa faixa horizontal (não há espaço vertical a
       recuperar) — some do mobile, só aparece em desktop/tablet largo. */
    #nav-colapsar-btn { display: none; }
  }

  .painel-filtros {
    background: var(--cartao);
    border-radius: 10px;
    padding: 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: flex-end;
    margin-bottom: 24px;
  }
  .campo { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 180px; }
  .campo label { font-size: 12px; color: var(--texto-fraco); text-transform: uppercase; }
  .campo input, .campo select {
    background: var(--fundo-fraco);
    border: 1px solid var(--input-borda);
    color: var(--texto);
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 14px;
  }
  /* O ícone padrão do calendário nativo (input type=date) vem escuro e quase invisível
     em cima do nosso fundo escuro -- inverte a cor pra ficar claro/visível e aumenta a
     área clicável, já que era isso que tornava difícil clicar certinho nele. */
  .campo input[type="date"] {
    cursor: pointer;
    color-scheme: dark;
  }
  .campo input[type="date"]::-webkit-calendar-picker-indicator {
    filter: invert(0.9);
    cursor: pointer;
    padding: 5px;
    margin-right: -4px;
    border-radius: 4px;
  }
  .campo input[type="date"]::-webkit-calendar-picker-indicator:hover {
    background: rgba(255,255,255,0.12);
  }
  html.tema-claro .campo input[type="date"] { color-scheme: light; }
  html.tema-claro .campo input[type="date"]::-webkit-calendar-picker-indicator { filter: none; }
  html.tema-claro .campo input[type="date"]::-webkit-calendar-picker-indicator:hover { background: rgba(0,0,0,0.06); }
  .btn-buscar {
    background: var(--laranja);
    border: none;
    color: #fff;
    padding: 11px 22px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    font-size: 14px;
  }
  .btn-buscar:disabled { opacity: 0.6; cursor: wait; }
